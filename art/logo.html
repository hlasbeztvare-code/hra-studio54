<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
#L{position:relative;width:900px;height:347px;overflow:hidden}
svg{position:absolute;inset:0}
.t{font-family:'Luckiest Guy';text-transform:none}
.s{font-family:'Pacifico'}
</style></head><body>
<div id="L">
<svg width="900" height="347" viewBox="-36 -24 972 395" xmlns="http://www.w3.org/2000/svg">
<defs>
 <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
  <circle cx="6" cy="6" r="2.6" fill="#C46A1E" opacity=".35"/>
 </pattern>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#F9C75A"/><stop offset=".6" stop-color="#F2A93B"/><stop offset="1" stop-color="#DE8A22"/>
 </linearGradient>
 <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#F6EFDC"/><stop offset=".5" stop-color="#E9E0C8"/><stop offset=".53" stop-color="#5b5446"/><stop offset="1" stop-color="#3d382f"/>
 </linearGradient>
</defs>
<!-- výbuch za deskou -->
<g transform="translate(450 178)">
 <path id="burst" d="" fill="none"/>
</g>
<!-- zlatá šikmá deska: stín, deska, rastr, obrys -->
<g transform="rotate(-7 450 175)">
 <path d="M70,120 L835,70 L860,232 L95,282 Z" transform="translate(14 16)" fill="#14100c"/>
 <path d="M70,120 L835,70 L860,232 L95,282 Z" fill="url(#gold)"/>
 <path d="M70,120 L835,70 L860,232 L95,282 Z" fill="url(#dots)"/>
 <path d="M70,120 L835,70 L860,232 L95,282 Z" fill="none" stroke="#14100c" stroke-width="9" stroke-linejoin="round"/>
 <path d="M96,132 L812,86" stroke="#FBE3A6" stroke-width="6" stroke-linecap="round" opacity=".8"/>
 <!-- STUDIO -->
 <g class="t" font-size="150" letter-spacing="2" transform="skewX(-8) translate(26 0)">
  <text x="104" y="226" fill="#14100c" stroke="#14100c" stroke-width="22" stroke-linejoin="round" transform="translate(9 11)">studio</text>
  <text x="104" y="226" fill="#14100c" stroke="#14100c" stroke-width="22" stroke-linejoin="round">studio</text>
  <text x="104" y="226" fill="url(#chrome)">studio</text>
 </g>
 <!-- 54 -->
 <g class="t" font-size="128" transform="skewX(-8) translate(30 0)">
  <text x="636" y="220" fill="#14100c" stroke="#14100c" stroke-width="20" stroke-linejoin="round" transform="translate(8 10)">54</text>
  <text x="636" y="220" fill="#14100c" stroke="#14100c" stroke-width="20" stroke-linejoin="round">54</text>
  <text x="636" y="220" fill="url(#chrome)">54</text>
 </g>
 <!-- podtitul -->
 <g class="s" font-size="36">
  <text x="300" y="276" fill="#14100c" stroke="#14100c" stroke-width="10" stroke-linejoin="round">Legendary After club</text>
  <text x="300" y="276" fill="#F6EFDC">Legendary After club</text>
 </g>
 <!-- jiskry -->
 <g fill="#F6EFDC" stroke="#14100c" stroke-width="4" stroke-linejoin="round">
  <path d="M600,60 l9,24 24,9 -24,9 -9,24 -9,-24 -24,-9 24,-9 Z"/>
  <path d="M842,196 l6,16 16,6 -16,6 -6,16 -6,-16 -16,-6 16,-6 Z"/>
  <path d="M86,262 l6,15 15,6 -15,6 -6,15 -6,-15 -15,-6 15,-6 Z"/>
 </g>
</g>
</svg>
</div>
<script>
// paprskový výbuch za deskou
const p=[],n=28;for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,r=i%2?118:(150+((i*37)%5)*6);p.push((Math.cos(a)*r*2.7).toFixed(1)+','+(Math.sin(a)*r*.98).toFixed(1));}
document.getElementById('burst').setAttribute('d','M'+p.join(' L')+' Z');
</script>
</body></html>
