<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@700&family=Titan+One&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0a0806}
.wrap{position:relative;width:1200px;height:630px;font-family:'Titan One',sans-serif}
.bg{position:absolute;inset:0;background:url(og_bg.jpg) center/cover;filter:brightness(.9) saturate(1.05)}
.sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,8,6,.92) 0%,rgba(10,8,6,.75) 42%,rgba(10,8,6,.1) 75%),radial-gradient(rgba(232,185,49,.12) 1.2px,transparent 1.8px) 0 0/8px 8px}
.frame{position:absolute;inset:0;border:12px solid #0a0806;box-shadow:inset 0 0 0 3px #E8B931,inset 0 0 0 8px #0a0806}
.logo{position:absolute;left:56px;top:44px;height:118px;filter:drop-shadow(0 5px 0 #000) drop-shadow(0 0 22px rgba(232,185,49,.4))}
h1{position:absolute;left:52px;top:178px;margin:0;font-weight:400;font-size:128px;line-height:.9;text-transform:uppercase;color:#FFF3D0;-webkit-text-stroke:14px #6b4a0c;paint-order:stroke fill;text-shadow:0 7px 0 #000,7px 12px 0 rgba(0,0,0,.5);transform:rotate(-3deg);transform-origin:left}
h1 span{color:#E8B931;-webkit-text-stroke-color:#0a0806}
.cap{position:absolute;left:62px;top:460px;width:500px;padding:14px 20px;background:#FFF3D0;border:4px solid #0a0806;box-shadow:7px 7px 0 #000;font-family:'Mali',sans-serif;font-weight:700;font-size:25px;line-height:1.3;color:#0a0806;transform:rotate(-1deg)}
.st{position:absolute;right:70px;bottom:62px;width:210px;height:210px;display:grid;place-items:center;text-align:center;transform:rotate(9deg)}
.st svg{position:absolute;inset:0}
.st b{position:relative;font-weight:400;font-size:33px;line-height:.95;color:#0a0806;text-transform:uppercase}
